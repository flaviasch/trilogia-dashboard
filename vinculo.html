<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script>(function(){try{if(localStorage.getItem('trilogia-theme')==='light')document.documentElement.setAttribute('data-theme','light');}catch(e){}})();</script>
<meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trilogia Dashboard — Vínculo de Casal</title>
  <link rel="icon" type="image/png" href="/icons/icon-192-v2.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0D2B45;
      --navy-dark: #081e30;
      --gold: #CFAE65;
      --gold-light: #e8d49b;
      --white: #FFFFFF;
      --border: rgba(var(--rgb-fg),0.1);
      --error: #f87171;
      --success: #4ade80;
  --rgb-fg: 255,255,255;
}

    [data-theme="light"] {
  --rgb-fg: 13,43,69;
  --navy-dark: #F8F1E7;
  --navy: #FFFFFF;
  --white: #0D2B45;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--navy-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--navy);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Playfair Display', serif;
      color: var(--white);
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .logo span { color: var(--gold); }
    .logo-icon { width: 28px; height: 28px; border-radius: 6px; flex-shrink: 0; }
    .eyebrow {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--gold);
      margin-bottom: 20px;
    }
    .titulo {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 600;
      color: var(--white);
      margin-bottom: 12px;
      line-height: 1.3;
    }
    .texto {
      font-size: 14px;
      color: rgba(var(--rgb-fg),0.65);
      line-height: 1.7;
      margin-bottom: 24px;
    }
    .btn {
      width: 100%;
      background: var(--gold);
      color: var(--navy);
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--gold-light); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secundario {
      width: 100%;
      background: transparent;
      color: rgba(var(--rgb-fg),0.65);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-perigo {
      width: 100%;
      background: transparent;
      color: var(--error);
      border: 1px solid rgba(248,113,113,0.4);
      border-radius: 8px;
      padding: 14px;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      margin-top: 8px;
    }
    .msg {
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .msg.visible { display: block; }
    .msg.error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: var(--error); }
    .msg.success { background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.3); color: var(--success); }
    .back {
      text-align: center;
      margin-top: 24px;
    }
    .back a {
      font-size: 13px;
      color: rgba(var(--rgb-fg),0.4);
      text-decoration: none;
    }
    .back a:hover { color: var(--gold); }
    #loading { text-align: center; color: rgba(var(--rgb-fg),0.4); font-size: 13px; }
  </style>
<!-- MOBILE_NAVBAR_FIX -->
<style>
@media (max-width: 640px) {
  .navbar-right { flex-wrap: wrap; justify-content: flex-end; gap: 8px; row-gap: 6px; width: 100%; }
  .navbar { flex-wrap: wrap; height: auto; min-height: 64px; padding: 10px 16px; }
  #btnTheme { padding: 5px 8px; margin-right: 0 !important; font-size: 14px; }
}
</style>

</head>
<body>

  <div class="card">
    <p class="logo"><img src="icons/icon-192-v2.png" alt="" class="logo-icon">Trilogia <span>Dashboard</span></p>
    <div class="eyebrow">Vínculo de Casal</div>

    <div id="loading">Carregando…</div>

    <div id="conteudo" style="display:none">
      <div class="msg" id="msg"></div>
      <div class="titulo" id="titulo"></div>
      <div class="texto" id="texto"></div>
      <div id="acoesConvite" style="display:none">
        <button class="btn" id="btnAceitar">Aceitar vínculo</button>
        <button class="btn-secundario" id="btnRecusar">Recusar</button>
      </div>
      <div id="acoesAtivo" style="display:none">
        <button class="btn-perigo" id="btnDesvincular">Desvincular</button>
      </div>
    </div>

    <div class="back">
      <a href="#" id="linkSair">Sair da conta</a>
    </div>
  </div>

  <script type="module">
    import { auth } from './js/firebase-config.js';
    import { exigirAuth, logout } from './js/admin-guard.js';
    import { getStatusVinculo, aceitarVinculo, recusarVinculo, desvincular, msgErro } from './js/api.js?v=62';

    document.getElementById('linkSair').addEventListener('click', (e) => { e.preventDefault(); logout(); });

    const elLoading = document.getElementById('loading');
    const elConteudo = document.getElementById('conteudo');
    const elTitulo = document.getElementById('titulo');
    const elTexto = document.getElementById('texto');
    const elMsg = document.getElementById('msg');
    const elAcoesConvite = document.getElementById('acoesConvite');
    const elAcoesAtivo = document.getElementById('acoesAtivo');

    function showMsg(text, type) {
      elMsg.textContent = text;
      elMsg.className = `msg visible ${type}`;
    }

    let _casalId = null;

    function render(status) {
      elLoading.style.display = 'none';
      elConteudo.style.display = '';
      elAcoesConvite.style.display = 'none';
      elAcoesAtivo.style.display = 'none';
      _casalId = status?.casalId || null;

      if (!status || status.papel === 'mentorada') {
        // Conta de mentorada não usa esta tela — segue pro dashboard normal.
        window.location.href = 'index.html';
        return;
      }

      if (status.papel !== 'parceiro' || !status.casalId) {
        elTitulo.textContent = 'Nenhum convite pendente';
        elTexto.textContent = 'Não encontramos nenhum vínculo de casal em andamento para esta conta no momento.';
        return;
      }

      if (status.casalStatus === 'pendente') {
        elTitulo.textContent = `${status.outroNome || 'Alguém'} te convidou`;
        elTexto.textContent = `${status.outroNome || 'Sua mentorada'} quer vincular as contas de vocês no Dashboard Trilogia Financeira, para acompanharem juntos o orçamento, patrimônio e reservas. Cada um mantém a própria conta e o próprio histórico — nada é compartilhado até você aceitar.`;
        elAcoesConvite.style.display = '';
        return;
      }

      if (status.casalStatus === 'ativo') {
        elTitulo.textContent = 'Vínculo ativo';
        elTexto.textContent = `Sua conta está vinculada com ${status.outroNome || 'sua mentorada'}. As telas de orçamento, patrimônio e reservas para você lançar seus próprios dados ainda estão em construção — assim que estiverem prontas, você vai poder usá-las por aqui.`;
        elAcoesAtivo.style.display = '';
        return;
      }

      elTitulo.textContent = 'Nenhum convite pendente';
      elTexto.textContent = 'Não encontramos nenhum vínculo de casal em andamento para esta conta no momento.';
    }

    document.getElementById('btnAceitar').addEventListener('click', async () => {
      if (!_casalId) return;
      const btn = document.getElementById('btnAceitar');
      btn.disabled = true;
      btn.textContent = 'Aceitando…';
      try {
        await aceitarVinculo(_casalId);
        const status = await getStatusVinculo();
        render(status);
      } catch (err) {
        showMsg(msgErro(err), 'error');
        btn.disabled = false;
        btn.textContent = 'Aceitar vínculo';
      }
    });

    document.getElementById('btnRecusar').addEventListener('click', async () => {
      if (!_casalId) return;
      if (!confirm('Recusar este convite de vínculo?')) return;
      const btn = document.getElementById('btnRecusar');
      btn.disabled = true;
      try {
        await recusarVinculo(_casalId);
        const status = await getStatusVinculo();
        render(status);
      } catch (err) {
        showMsg(msgErro(err), 'error');
        btn.disabled = false;
      }
    });

    document.getElementById('btnDesvincular').addEventListener('click', async () => {
      if (!_casalId) return;
      if (!confirm('Desvincular o casal? Nenhum dado é apagado, só a consolidação para de acontecer.')) return;
      const btn = document.getElementById('btnDesvincular');
      btn.disabled = true;
      try {
        await desvincular(_casalId);
        const status = await getStatusVinculo();
        render(status);
      } catch (err) {
        showMsg(msgErro(err), 'error');
        btn.disabled = false;
      }
    });

    exigirAuth().then(async () => {
      try {
        const status = await getStatusVinculo();
        render(status);
      } catch (err) {
        elLoading.textContent = 'Erro ao carregar. Recarregue a página.';
      }
    });
  </script>

<script src="js/theme.js" defer></script>
</body>
</html>
