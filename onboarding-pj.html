<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trilogia Dashboard PJ — Sua empresa</title>
  <link rel="icon" type="image/png" href="/icons/icon-192-v2.png" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0D2B45;
      --navy-dark: #081e30;
      --gold: #CFAE65;
      --gold-light: #e8d49b;
      --white: #FFFFFF;
      --border: rgba(255,255,255,0.1);
      --error: #f87171;
      --text-muted: rgba(255,255,255,0.45);
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--navy-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--navy);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 460px;
    }
    .logo {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: 'Playfair Display', serif;
      color: var(--white); font-size: 20px; font-weight: 600;
      margin-bottom: 8px;
    }
    .logo span { color: var(--gold); }
    .logo-icon { width: 28px; height: 28px; border-radius: 6px; flex-shrink: 0; }
    .subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 32px; line-height: 1.5; }
    .field-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
    label { font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.6); }
    label .opcional { color: var(--text-muted); font-weight: 400; }
    input, select {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 14px;
      color: var(--white);
      font-family: 'Inter', sans-serif;
      width: 100%;
    }
    input:focus, select:focus { outline: none; border-color: rgba(207,174,101,0.5); }
    input::placeholder { color: rgba(255,255,255,0.25); }
    select option { background: var(--navy); color: var(--white); }
    .regime-ajuda { font-size: 12px; color: var(--text-muted); margin-top: 6px; line-height: 1.5; }
    .btn-salvar {
      width: 100%;
      background: var(--gold);
      color: var(--navy);
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-salvar:hover { background: var(--gold-light); }
    .btn-salvar:disabled { opacity: 0.6; cursor: not-allowed; }
    .error-msg {
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.3);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--error);
      margin-bottom: 16px;
      display: none;
    }
    .error-msg.visible { display: block; }
  </style>
</head>
<body>

  <div class="card">
    <p class="logo"><img src="icons/icon-192-v2.png" alt="" class="logo-icon">Trilogia <span>Dashboard PJ</span></p>
    <p class="subtitle">Antes de começar, conta um pouco sobre sua empresa. Isso ajuda a sugerir os tributos certos pra você configurar depois.</p>

    <div class="error-msg" id="errorMsg"></div>

    <div class="field-group">
      <label for="nomeEmpresa">Nome da empresa</label>
      <input type="text" id="nomeEmpresa" placeholder="Ex: Minha Consultoria LTDA" />
    </div>

    <div class="field-group">
      <label for="cnpj">CNPJ <span class="opcional">(opcional)</span></label>
      <input type="text" id="cnpj" placeholder="00.000.000/0000-00" maxlength="18" />
    </div>

    <div class="field-group">
      <label for="regime">Regime tributário</label>
      <select id="regime">
        <option value="mei">MEI</option>
        <option value="simples">Simples Nacional</option>
        <option value="presumido">Lucro Presumido</option>
      </select>
      <p class="regime-ajuda" id="regimeAjuda"></p>
    </div>

    <button class="btn-salvar" id="btnSalvar">Continuar</button>
  </div>

  <script type="module">
    import { auth } from './js/firebase-config.js';
    import { salvarOnboardingPJ } from './js/api.js?v=44';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    let currentUser = null;
    onAuthStateChanged(auth, (user) => {
      if (!user) { window.location.href = 'login-pj.html'; return; }
      currentUser = user;
    });

    const AJUDA_REGIME = {
      mei:       'MEI paga um valor fixo mensal (DAS), não muda com o faturamento.',
      simples:   'Simples Nacional calcula um DAS único, por faixa de faturamento acumulado.',
      presumido: 'Lucro Presumido apura tributos separados (ISS, PIS, COFINS, IRPJ, CSLL).',
    };
    const selRegime = document.getElementById('regime');
    const elAjuda    = document.getElementById('regimeAjuda');
    function atualizarAjuda() { elAjuda.textContent = AJUDA_REGIME[selRegime.value] || ''; }
    selRegime.addEventListener('change', atualizarAjuda);
    atualizarAjuda();

    const btnSalvar = document.getElementById('btnSalvar');
    const errorMsg  = document.getElementById('errorMsg');
    function showError(msg) { errorMsg.textContent = msg; errorMsg.classList.add('visible'); }
    function hideError() { errorMsg.classList.remove('visible'); }

    btnSalvar.addEventListener('click', async () => {
      hideError();
      if (!currentUser) return;

      const nomeEmpresa = document.getElementById('nomeEmpresa').value.trim();
      const cnpj        = document.getElementById('cnpj').value.trim();
      const regime       = selRegime.value;

      if (!nomeEmpresa) { showError('Informe o nome da empresa.'); return; }

      btnSalvar.disabled = true;
      btnSalvar.textContent = 'Salvando…';
      try {
        await salvarOnboardingPJ(currentUser.uid, { nomeEmpresa, cnpj: cnpj || null, regime });
        window.location.href = 'impostos-pj.html';
      } catch (err) {
        showError(err?.message || 'Erro ao salvar. Tente novamente.');
        btnSalvar.disabled = false;
        btnSalvar.textContent = 'Continuar';
      }
    });
  </script>

</body>
</html>
