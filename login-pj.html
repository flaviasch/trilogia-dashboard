<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trilogia Dashboard PJ — Login</title>
  <link rel="icon" type="image/png" href="/icons/icon-192-v2.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js" />
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0D2B45;
      --navy-dark: #081e30;
      --gold: #CFAE65;
      --gold-light: #e8d49b;
      --white: #FFFFFF;
      --border: rgba(255,255,255,0.1);
      --error: #f87171;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--navy-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      background: var(--navy);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Playfair Display', serif;
      color: var(--white);
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .logo span { color: var(--gold); }
    .logo-icon { width: 28px; height: 28px; border-radius: 6px; flex-shrink: 0; }
    .badge-pj {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--gold);
      background: rgba(207,174,101,.12);
      border-radius: 4px;
      padding: 2px 8px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .subtitle {
      font-size: 13px;
      color: rgba(255,255,255,0.45);
      margin-bottom: 36px;
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }
    label {
      font-size: 12px;
      font-weight: 500;
      color: rgba(255,255,255,0.6);
    }
    input {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 14px;
      color: var(--white);
      font-family: 'Inter', sans-serif;
      transition: border-color 0.2s;
      width: 100%;
    }
    input:focus { outline: none; border-color: rgba(207,174,101,0.5); }
    input::placeholder { color: rgba(255,255,255,0.25); }
    .btn-login {
      width: 100%;
      background: var(--gold);
      color: var(--navy);
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .btn-login:hover { background: var(--gold-light); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
    .forgot { text-align: center; margin-top: 20px; }
    .forgot a {
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      text-decoration: none;
      transition: color 0.2s;
    }
    .forgot a:hover { color: var(--gold); }
    .error-msg {
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.3);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--error);
      margin-bottom: 16px;
      display: none;
    }
    .error-msg.visible { display: block; }
    .nota-mesma-conta {
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      margin-top: 20px;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <p class="logo"><img src="icons/icon-192-v2.png" alt="" class="logo-icon">Trilogia <span>Dashboard</span><span class="badge-pj">PJ</span></p>
    <p class="subtitle">Acesse a área da sua empresa</p>

    <div class="error-msg" id="errorMsg"></div>

    <div class="field-group">
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" />
    </div>

    <div class="field-group">
      <label for="password">Senha</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
    </div>

    <button class="btn-login" id="btnLogin">Entrar</button>

    <div class="forgot">
      <a href="recuperar-senha.html">Esqueci minha senha</a>
    </div>

    <p class="nota-mesma-conta">Já é mentorada da Trilogia? Use o mesmo e-mail e senha da sua conta pessoal — a área da empresa é separada por dentro, não precisa de outro cadastro.</p>
  </div>

  <script type="module">
    import { auth } from './js/firebase-config.js';
    import { getContaPJ } from './js/api.js?v=45';
    import {
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    let jaRedirecionando = false;

    async function decidirDestino(user) {
      if (jaRedirecionando) return;
      jaRedirecionando = true;
      try {
        const conta = await getContaPJ(user.uid);
        // ativo controlado à parte do Auth (achado 26/07/2026: o Auth é
        // compartilhado com a conta PF, então não dá pra usar auth/user-disabled
        // pra bloquear só o PJ) — se a Flávia desativou o acesso PJ, desloga e
        // avisa aqui, sem mexer na sessão da conta PF que pode continuar ativa.
        if (conta && conta.ativo === false) {
          await signOut(auth);
          jaRedirecionando = false;
          showError('Seu acesso ao Dashboard PJ está suspenso. Entre em contato com a Flávia.');
          return;
        }
        window.location.href = conta ? 'impostos-pj.html' : 'onboarding-pj.html';
      } catch (err) {
        jaRedirecionando = false;
        showError('Não foi possível verificar sua conta. Tente novamente.');
      }
    }

    onAuthStateChanged(auth, (user) => {
      if (user) decidirDestino(user);
    });

    const btnLogin = document.getElementById('btnLogin');
    const errorMsg = document.getElementById('errorMsg');

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.add('visible');
      btnLogin.disabled = false;
      btnLogin.textContent = 'Entrar';
    }
    function hideError() { errorMsg.classList.remove('visible'); }

    btnLogin.addEventListener('click', async () => {
      hideError();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showError('Preencha e-mail e senha para continuar.');
        return;
      }

      btnLogin.disabled = true;
      btnLogin.textContent = 'Entrando...';

      try {
        await signInWithEmailAndPassword(auth, email, password);
        // decidirDestino roda pelo onAuthStateChanged
      } catch (err) {
        if (err.code === 'auth/user-disabled') {
          showError('Seu acesso está suspenso. Entre em contato com a Flávia.');
        } else if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') {
          showError('E-mail ou senha incorretos. Verifique e tente novamente.');
        } else if (err.code === 'auth/too-many-requests') {
          showError('Muitas tentativas. Aguarde alguns minutos e tente novamente.');
        } else {
          showError('Erro ao fazer login. Tente novamente.');
        }
      }
    });

    document.getElementById('password').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') btnLogin.click();
    });
  </script>

</body>
</html>
